name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pip check
      - run: python -m compileall -q backend
      - run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd frontend && npm install --no-fund --no-audit && npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build the production hosting image
        run: docker build --pull -t sentinelscope:ci .
      - name: Smoke-test the production container
        run: |
          set -eu
          docker run -d --name sentinelscope-smoke -p 10000:10000 \
            -e APP_ENCRYPTION_KEY= \
            -e SESSION_COOKIE_SECURE=0 \
            -e TRUST_PROXY_HEADERS=0 \
            -e CORS_ORIGINS=http://localhost:10000 \
            -e PUBLIC_APP_URL=http://localhost:10000 \
            sentinelscope:ci
          cleanup() { docker logs sentinelscope-smoke || true; docker rm -f sentinelscope-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health; then
              echo "Container health endpoint passed."
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy."
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend, container]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: cd frontend && npm install --no-fund --no-audit
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run e2e
